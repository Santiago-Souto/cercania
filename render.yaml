# Render Blueprint: connect the repo in Render -> New -> Blueprint.
# Variables marked `sync: false` are secrets: Render asks for them on first
# deploy, and they are never stored in this file.
services:
  - type: web
    name: cercania-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Secret: Render asks for the value on first deploy (Supabase session pooler URL).
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Claude (extraction, triage, cited query). The SDK reads it from the environment.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # SIMULATED identity (X-Person-Id header) until login lands. "1" only with fictional data.
      - key: ALLOW_DEV_IDENTITY_HEADER
        sync: false

  # Next.js web app. Pages fetch the API server-side, so no CORS is needed yet.
  - type: web
    name: cercania-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      # NEXT_PUBLIC_* are baked in at build time: change them, then redeploy.
      # Public API URL with https, e.g. https://cercania-api.onrender.com. Not fromService:
      # that gives a private host, and free services cannot receive private traffic.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # "1" = fictional fake data with a visible banner (SIMULATED, see README).
      # Stays on until the read endpoints land (CIA-14); then set to 0 and redeploy.
      - key: NEXT_PUBLIC_USE_FAKE_DATA
        value: "1"
