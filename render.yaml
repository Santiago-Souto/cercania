# Render Blueprint: connect the repo in Render -> New -> Blueprint.
# Variables marked `sync: false` are secrets: Render asks for them on first
# deploy, and they are never stored in this file.
services:
  - type: web
    name: cercania-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Secret: Render asks for the value on first deploy (Supabase session pooler URL).
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Groq: transcription and, by default, checklist extraction.
      - key: GROQ_API_KEY
        sync: false
      # LLM vendor (backend/app/llm.py). Extraction, triage and the cited query all
      # default to Groq (GROQ_API_KEY); set *_MODEL to <provider>:<model> to switch.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EXTRACT_MODEL
        sync: false
      - key: TRIAGE_MODEL
        sync: false
      - key: QUERY_MODEL
        sync: false
      # Supabase Storage for voice notes (private bucket, signed URLs). Service key: backend only.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: media
      # Browser origins allowed by CORS (comma-separated; credentials on, so never "*").
      # Unset = no browser can call the API.
      - key: WEB_ORIGINS
        value: https://cercania-web.onrender.com
      # The browser reaches the API through the web's /api rewrite, so the session cookie is first-party.
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      # SIMULATED identity (X-Person-Id header), backend dev fallback only. Leave unset in the deploy.
      - key: ALLOW_DEV_IDENTITY_HEADER
        sync: false

  # Next.js web app. Browser-side calls go to /api/* on this origin, rewritten to the API.
  - type: web
    name: cercania-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      # Baked in at build time (also the target of the /api rewrite): change it, then redeploy.
      # Public API URL with https, e.g. https://cercania-api.onrender.com. Not fromService:
      # that gives a private host, and free services cannot receive private traffic.
      - key: NEXT_PUBLIC_API_URL
        sync: false
