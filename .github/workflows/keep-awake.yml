# Keeps the Render free-plan services awake (they sleep after ~15 min idle).
# One request to the web's /api/health reaches both services: the web serves it
# and its /api/* rewrite forwards it to the API. See docs/deploy.md.
name: Keep Render awake

on:
  schedule:
    # Every 5 min, 09:00-19:55 Argentina time (UTC-3, no DST). GitHub often starts
    # scheduled runs late, and Render sleeps at ~15 min. Daytime only, so both
    # services fit Render's 750 free instance hours a month (see docs/deploy.md).
    - cron: "*/5 12-22 * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping web and API
        # A cold start takes about a minute, so allow long requests and retry once
        # (worst case 2 x 90 s + 10 s, inside the job timeout and the cron interval).
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 1 --retry-delay 10 --retry-all-errors \
            https://cercania-web.onrender.com/api/health
