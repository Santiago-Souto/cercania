# Keeps the Render free-plan services awake (they sleep after ~15 min idle).
# One request to the web's /api/health reaches both services: the web serves it
# and its /api/* rewrite forwards it to the API. See docs/deploy.md.
name: Keep Render awake

on:
  schedule:
    # Every 5 min: GitHub often starts scheduled runs late, and Render sleeps at ~15 min.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping web and API
        # A cold start takes about a minute, so allow long requests and retry.
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://cercania-web.onrender.com/api/health
